# Spell-check config — `just typos`.

[files]
extend-exclude = [
    "deps/",
    "target/",
    ".direnv/",
    # Raw captures are frozen evidence, including vendor firmware spelling.
    "evidence/duo/*.log",
]

[default.extend-words]
# QEMU's `passt` network backend and the Synopsys IP vendor, named as written.
passt = "passt"
synopsys = "synopsys"
Synopsys = "Synopsys"
# x86 Interrupt Stack Table
ist = "ist"
# ELF relocation-with-addend sections (.rela.dyn, SHT_RELA)
rela = "rela"
# High Definition Audio
hda = "hda"
# ACPI OEM table id fixture, deliberately 8 bytes
inventry = "inventry"
# Common hex bytes in fixtures. `daa` occurs inside the upstream
# `sensor_msgs/msg/PointCloud2` RIHS01 digest the RPi5 contract gate validates
# its type-hash implementation against; the digest is copied from `ros2/rcl` and
# cannot be reworded.
ba = "ba"
daa = "daa"
# Git short hashes cited in devlog entries; `caf` occurs inside `e4caf6c`, which
# is an identity and cannot be reworded.
caf = "caf"
# "mis" prefix in identifiers
mis = "mis"
ot = "ot"
nd = "nd"
scap = "scap"
ded = "ded"
bui = "bui"
# AArch64 translation-table field name from the Arm architecture.
Indx = "Indx"
# The Framework's firmware vendor, exactly as its DMI reports it
# (`/sys/class/dmi/id/bios_vendor`). P6.6's observation record pins the
# firmware vendor to what the machine actually said, so this string cannot be
# reworded.
INSYDE = "INSYDE"
Insyde = "Insyde"
# Standard 16550 UART transmit-register and line-status names.
THR = "THR"
THRE = "THRE"
# Fragment of "pre-empted" (seL4's own spelling of "preempted"), which the
# tokenizer splits at the hyphen; occurs verbatim in a vendored seL4 header
# under `contracts/system-image-closure/v1/inputs/sel4-prefix/` and in devlog
# prose citing it.
empted = "empted"

[default.extend-identifiers]
# `ser2net`, the serial-over-TCP bridge a remote board console is reached
# through. Accepted as a whole identifier rather than by adding `ser` to the
# word list, which would suppress a real misspelling everywhere else.
ser2net = "ser2net"
# Zutai's typed high-level IR, and the crate named after it (`zutai-thir`),
# which devloop locks by name in its Cargo lock.
thir = "thir"

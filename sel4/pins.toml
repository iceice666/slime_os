# `platform_info_sha256` here: an x86 machine describes itself through ACPI at
# run time, so seL4 pc99 compiles no device tree and generates no
# `platform_gen.yaml`, and the install has no `support/` directory at all.
# `check-sel4-pins.py` asserts that absence rather than skipping it.

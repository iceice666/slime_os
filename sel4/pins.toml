# The same contract for P4's board kernel, observed from
# `just sel4_rpi5_image_check`. A separate table because this is a different
# kernel from the one above — different platform, CPU, device tree, and
# interrupt controller — so a single set of hashes could not describe both.
#
# `dtb_sha256` is a stronger pin here than for qemu-arm-virt: the Pi 5's device
# tree is compiled from `deps/sel4/tools/dts/rpi5b.dts` plus the two overlays
# rather than dumped from an emulator, so this hash changes if and only if the
# pinned kernel's own board description changes. Widening the memory overlay
# moves it, which is the intended alarm.
# P7's physical AArch64 target. Every value here was read from the running
# board or from the generated kernel configuration, never asserted:
#  * `cpu` from the boot CPU's MIDR_EL1 `0x412fd050`.
#  * `serial`/`serial_baud` from the firmware-final device tree's
#    `serial@994000` and its `stdout-path`, the same engine the vendor Linux
#    drives as `ttyMSM0`.
#  * `interrupt_controller` and its two windows from `interrupt-controller@
#    17a00000`, whose `compatible` is `arm,gic-v3`.
#  * `timer_frequency_hz` from `CNTFRQ_EL0`, confirmed by the KVM-enabled
#    Linux boot.
#  * `max_irq` from Linux's own report of 928 implemented SPIs, which is an
#    inclusive maximum ID of 959 after the 16 SGIs and 16 PPIs.
#  * `usable_memory_bytes` is the conservative window this port declares
#    (`0xa0200000..0xb9700000`), not the board's whole DRAM: the low fragmented
#    firmware and subsystem ranges are withheld until separately qualified,
#    and the space below the window stays available to the Linux kexec loader
#    that hands control over.
#
# The board reaches EL2 only under the official QLI 1.6 KVM `xbl_config`
# overlay; under the shipped Gunyah configuration a payload enters at EL1 and
# this kernel's hypervisor build cannot run.
[rubikpi3]
platform = "rubikpi3"
sel4_arch = "aarch64"
cpu = "cortex-a55"
soc = "qcs6490"
board = "thundercomm-rubik-pi-3-v02"
hypervisor = true
mcs = false
nodes = 1
verification_build = false
debug_build = true
printing = true
serial = "uart0-qcom-geni-0x00994000"
serial_baud = 115200
interrupt_controller = "arm-gic-v3"
timer_frequency_hz = 19200000
max_irq = 959
usable_memory_bytes = 424673280
# Empty because it is true, not because it is unknown: this board's firmware
# loads no Slime file. Control arrives by `kexec` from the installed Linux,
# which copies an arm64 `Image` to a fixed physical base and jumps to it, so
# the handoff contract is that image's own header and placement rather than a
# set of files a boot ROM reads.
boot_files = []
export_pcnt_user = true
export_ptmr_user = true


schema = 1

[sel4]
# A fork commit that declares a platform or a CPU option adds that option --
# off -- to every platform's generated kernel config, so `kernel_config_sha256`
# moves for all of them while every other pinned artifact stays byte-identical.
# When that is the whole of the drift, re-pin the config hashes in the same
# change; anything else moving is a finding.
repository = "https://github.com/iceice666/seL4.git"
release = "16.0.0"
commit = "1b93edf532c5b53e607b4f4f9fa226f78a63ec13"

[rust_sel4]
# Forked from seL4/rust-sel4 at v5.0.0 (d441a880938209f661201704dfbee7b91c5aa905)
# for the physical platforms Slime boots. The fork adds bcm2712's UART10
# loader path, CV1800B's single-hart path (the Duo's OpenSBI 0.9 exposes no
# HSM extension, so the generic RISC-V loader would panic before printing),
# and the NT98690 H1V1's inline 16550 console at 0x2f0130000, for which no
# driver crate exists.
repository = "https://github.com/iceice666/rust-sel4.git"
release = "v5.0.0-slime-physical-platforms"
commit = "20905bef6b93b7d863ac6dc5d7053f96aa09765a"
toolchain = "nightly-2026-04-04"
root_target = "deps/rust-sel4/support/targets/aarch64-sel4-roottask-minimal.json"
root_target_sha256 = "84fcb8cd021b032041f1e2b0c4996cafc8d7aa0f7ba2ae56d5868a313c53956e"
riscv64_root_target = "deps/rust-sel4/support/targets/riscv64imac-sel4-roottask-minimal.json"
riscv64_root_target_sha256 = "1ba7236f7df19f49777dc2f3bc189ea06ce30d7af1e3746c0183fe94467f64c9"
loader_target = "aarch64-unknown-none"
riscv64_loader_target = "riscv64imac-unknown-none-elf"

[qemu_arm_virt]
platform = "qemu-arm-virt"
sel4_arch = "aarch64"
hypervisor = true
mcs = false
nodes = 1
verification_build = false
debug_build = true
printing = true
machine = "virt,virtualization=on"
cpu = "cortex-a53"
cpus = 1
memory_mib = 2048
qemu_version = "11.0.1"
# `slime-root`'s timer phase programs the EL1 physical timer directly from
# EL0 (`slime-root/src/platform_timer.rs`); these grant PL0 access to the
# physical counter/frequency and physical timer control/compare registers.
export_pcnt_user = true
export_ptmr_user = true

# P3's architecture reference. These are QEMU's explicit machine facts and
# seL4's qemu-riscv-virt defaults, pinned so the port never inherits a newer
# emulator's ISA, interrupt, timer, or memory profile silently.
[qemu_riscv_virt]
platform = "qemu-riscv-virt"
sel4_arch = "riscv64"
isa = "rv64imac_zicsr_zifencei"
mmu = "sv39"
mcs = false
nodes = 1
verification_build = false
debug_build = true
printing = true
machine = "virt"
cpu = "rv64"
cpus = 1
memory_mib = 3072
qemu_version = "11.0.1"
firmware = "rust-sel4 kernel loader with embedded OpenSBI"
interrupt_controller = "sifive-plic-1.0.0"
timer_frequency_hz = 10000000
uart = "ns16550a-0x10000000"
virtio_mmio_base = "0x10001000"
virtio_mmio_count = 8

# P4's physical target. Every value here is read from seL4's own platform
# description or the board's firmware device tree, never asserted by Slime:
#  * `serial`/`serial_baud` from `deps/sel4/tools/dts/rpi5b.dts`, whose
#    `aliases/serial10` resolves to `/soc@107c000000/serial@7d001000`
#    (`compatible = "arm,pl011"`) and whose `chosen/stdout-path` is
#    `serial10:115200n8`. `src/plat/bcm2712/overlay-rpi5.dts` names that same
#    alias in `seL4,elfloader-devices` and `seL4,kernel-devices`, and the
#    firmware DTB on boot media agrees (`aliases/console`).
#  * `interrupt_controller` from that platform's
#    `INTERRUPT_CONTROLLER arch/machine/gic_v2.h`, matching the board's
#    GIC-400 at `interrupt-controller@7fff9000`.
#  * `timer_frequency_hz` from its `TIMER_FREQUENCY 54000000`, and `max_irq`
#    from its `MAX_IRQ 320`.
#  * `usable_memory_bytes` is what the installed `platform_gen.json` reports
#    once seL4 subtracts the firmware's ATF reservation from the overlay's
#    single range: 0x80000..0x3fc00000. See `sel4/config/bcm2712-rpi5.cmake`
#    for why this is not the board's full RAM.
#
# `boot_files` is the firmware contract, not a Slime choice: the BCM2712 ROM
# reads the SPI EEPROM, which reads a FAT32 partition and loads `config.txt`
# and the 64-bit kernel it names.
[bcm2712_rpi5]
platform = "bcm2712"
sel4_arch = "aarch64"
cpu = "cortex-a76"
soc = "bcm2712"
board = "raspberry-pi-5-model-b"
# Observed in the built prefix, not chosen here: the pinned verified profile
# `AARCH64_bcm2712_verified.cmake` leaves `CONFIG_ARM_HYPERVISOR_SUPPORT` set,
# and `overlay-rpi5.dts` supplies the vGIC maintenance IRQ that mode needs.
hypervisor = true
mcs = false
nodes = 1
verification_build = false
debug_build = true
printing = true
serial = "uart10-pl011-0x107d001000"
serial_baud = 115200
interrupt_controller = "arm-gic-400-gicv2"
timer_frequency_hz = 54000000
max_irq = 320
usable_memory_bytes = 1069023232
boot_files = ["config.txt", "kernel8.img"]
export_pcnt_user = true
export_ptmr_user = true

# P3.D's physical RISC-V bring-up board. Every value here was read from the
# running board or from the vendor firmware's own source, never asserted:
#  * `serial_baud` from the vendor console (`console=ttyS0,115200` in
#    `/proc/cmdline`), on UART0 at 40-pin header pins 16 (TX) / 17 (RX) /
#    18 (GND) per Milk-V's own pinout.
#  * `dram_base`/`dram_size` from the board's device tree
#    `memory@80000000/reg` = <0x80000000 0x03f40000>. The vendor Linux sees
#    only ~28 MiB of that because of its ION/multimedia carve-outs
#    (`reserved-memory/ion`), so a Slime port must publish its own memory
#    description rather than inherit this one.
#  * `sbi_reservation_bytes` from `reserved-memory/mmode_resv0@80000000`
#    = <0x80000000 0x00040000>, the OpenSBI region.
#  * `interrupt_controller` from `interrupt-controller@70000000`, whose
#    `compatible` is `riscv,plic0` — the layout seL4's own
#    `include/drivers/irq/riscv_plic0.h` family implements.
#  * `timer_frequency_hz` from `cpus/timebase-frequency` = 0x017d7840. This is
#    the value a kernel platform port must set; it is NOT QEMU's 10 MHz.
#  * `sbi_spec`/`sbi_impl` from the vendor kernel's own boot log. Note the
#    absence of SRST: this firmware implements the legacy calls plus
#    TIME/IPI/RFENCE only, so a payload must not rely on SBI system reset.
#  * `isa`/`mmu` from `/proc/cpuinfo`. `v` appears in the vendor string but
#    seL4 16.0.0 places no vector state in its context, which is compatible.
#
# The U-Boot facts are the firmware contract, not a Slime choice. This build of
# U-Boot 2021.10 is compiled without `go`, `booti`, `bootelf`, `loadx`/`loady`
# and TFTP, so `bootm` on a FIT is the only way to transfer control, and there
# is no writable environment store (`CONFIG_CMD_SAVEENV` unset, and
# `Loading Environment from <NULL>`), so autoboot must be interrupted on every
# iteration rather than `bootcmd` being changed once.
[cv1800b_duo]
soc = "cv1800b"
board = "milkv-duo"
cpu = "thead-c906"
isa = "rv64imafdvcsu"
mmu = "sv39"
serial_baud = 115200
serial_header_pins = "16-tx/17-rx/18-gnd"
dram_base = "0x80000000"
dram_size = "0x03f40000"
serial = "uart0-dw-apb-0x04140000"
sbi_reservation_bytes = 262144
interrupt_controller = "riscv-plic0-0x70000000"
timer_frequency_hz = 25000000
sbi_spec = "0.3"
sbi_impl = "opensbi-0.9"
sbi_has_srst = false
uboot_version = "2021.10-cvitek_cv180x"
uboot_prompt = "cv180x_c906#"
uboot_launch = "bootm {staging}#{config}"
fit_staging_address = "0x81400000"
payload_load_address = "0x82000000"
boot_partition = "mmc 0:1"
usb_ncm_address = "192.168.42.1"
boot_files = [
  "slime-sel4-cv1800b-duo.itb",
  "slime-sel4-sample-cv1800b-duo.itb",
  "slime-sel4-sample-cv1800b-duo-early-fault.itb",
]

# The exact physical seL4 product profile for the same board facts above.
# `platform` selects the in-tree seL4 port; `timer_irq` is the RTC alarm's
# observed PLIC source. UART0 remains the kernel's debug console.
platform = "cv1800b-duo"
sel4_arch = "riscv64"
mcs = false
nodes = 1
verification_build = false
debug_build = true
printing = true
export_time_user = true
timer_irq = 17
max_irq = 101
usable_memory_bytes = 66060288
fit_config = "config-duo-sel4"

# P6.A: the Novatek NT98690 (NS02201) H1V1, a physical AArch64 bring-up target.
#
# Board facts only. This table carries no seL4 product keys -- no `platform`,
# `sel4_arch`, or printing options -- because P6.A builds no kernel: it
# qualifies the firmware handoff and measures what the board actually reports.
# P6.B adds the product half beside these, along with its own
# `[observed_prefix_ns02201_h1v1]`.
#
# Sources, since none of this may be asserted by Slime:
#   vendor device tree  /srv/novatek/sdk/worktrees/h1v1-dev/configs/Linux/
#                       cfg_690_IPC_EMMC_RAMDISK_CM2504/nvt-{basic,peri,mem-tbl}.dtsi
#   TF-A                BSP/trusted-firmware-a/plat/novatek/nvt_ns02201/
#   U-Boot              BSP/u-boot/configs/nvt-ns02201_a64_pci_emmc_defconfig
#   board switches      ~/nt98690-ubuntu/project_env.sh
# Keys marked "observed" are filled from a recorded serial transcript, not from
# any of the above; until P6.A runs they are absent rather than guessed.
[ns02201_h1v1]
soc = "ns02201"
board = "novatek-h1v1"
cpu = "cortex-a73"
cpus = 4
# 16550-compatible, and the same port BL31 and U-Boot print through -- so the
# console is continuous from firmware into anything Slime loads. `reg-shift`
# and `reg-io-width` are why the holding and line-status registers sit at byte
# offsets 0x00 and 0x14 with 32-bit accesses.
serial = "uart0-ns16550a-0x2f0130000"
serial_reg_shift = 2
serial_reg_io_width = 4
serial_clock_hz = 48000000
serial_baud = 115200
# Two GiB is populated, but the vendor `/memory` node declares one, which is
# what U-Boot's `gd->ram_size` reports and therefore all any loader may assume.
dram_base = "0x0"
dram_size = "0x80000000"
firmware_memory_size = "0x40000000"
# BL31 lives here and the device tree marks it `no-map`. TF-A's TZASC
# programming protects it from DMA masters only, so nothing stops a CPU write:
# it is reserved by agreement, and every payload address is chosen around it.
atf_base = "0x01f00000"
atf_size = "0x00100000"
# GICv2, with every bank above 4 GiB like the rest of this SoC's MMIO.
interrupt_controller = "arm-gicv2-0x2fff01000"
gicd_base = "0x2fff01000"
gicc_base = "0x2fff02000"
gich_base = "0x2fff04000"
gicv_base = "0x2fff06000"
# What the device tree claims. TF-A writes `CNTFRQ_EL0` on secondary cores
# only, so the primary's value is a separate, observed key below.
dts_timer_frequency_hz = 12000000
psci = "0.2-smc"
# The U-Boot facts below were read off the board on 2026-09-02 and are no
# longer inferred from vendor source; the transcript is
# devlog/2026-09-01-p6a-nt98690-probe/uboot-survey.log. `mmc list` reports
# MMC0 as the SD slot and MMC2 as the eMMC, so device 0 is the removable card
# and no gate command addresses the eMMC.
uboot_version = "2021.10-novatek-ns02201"
uboot_prompt = "nvt: "
uboot_select_device = "mmc dev 0"
# `booti` is the only entry command this U-Boot has: `go`, `bootelf`, and
# `bootm` are all compiled out. The device-tree argument is not optional --
# omitting it panics U-Boot -- and `${fdtcontroladdr}` is the tree the vendor
# loader passed in, which U-Boot relocates and hands to us in x0.
uboot_launch = "booti {load} - ${fdtcontroladdr}"
# Where the payload is linked, where it is loaded, and what its Image header
# declares as `text_offset`; this U-Boot relocates to `text_offset` regardless
# of the header's placement flag, so all three must be this value.
payload_load_address = "0x10000000"
boot_partition = "mmc 0:1"
# eMMC 8-bit with an SD card inserted. `0x0001` is the loader's SD rescue mode,
# which reflashes firmware, and is never the position for booting a payload.
sw18_boot_position = "0x1001"

# Read off the board by the P6.A probe on 2026-09-02; transcript in
# devlog/2026-09-01-p6a-nt98690-probe/. These are the measurements P6.B's
# kernel configuration is built from, not restatements of the device tree.
entry_el_observed = 2
midr = "0x411fd090"
parange = 2
physical_address_bits = 40
# CNTFRQ_EL0 *is* programmed on the primary core, contrary to the reading of
# TF-A's plat_helpers.S that shaped the P6.B plan: it holds 12 MHz, and an
# independent estimate against the 115200 line rate agreed to 0.33%. P6.B can
# therefore take the timer frequency from the register and needs no pinned
# override of the kind the Milk-V Duo required.
cntfrq_el0_primary_hz = 12000000
counter_hz_estimated = 11960950
# GICv2, ARM GIC-400: ID_AA64PFR0_EL1.GIC reads 0, so there is no system
# register interface and the memory-mapped distributor is the only path.
gicd_typer = "0x0000fc6a"
gicd_iidr = "0x0200143b"
gic_irqs = 352
gic_cpu_interfaces = 4

# The exact physical seL4 product profile for the board facts above, P6.B.
# `platform` selects the in-tree seL4 port (`src/plat/ns02201` in the pinned
# fork); the kernel is a hypervisor build because firmware enters at EL2 and
# the loader asserts it; `timer_irq` is CNTP's PPI 30, the one architected
# timer line a hypervisor-mode seL4 leaves to userspace; `timer_frequency_hz`
# restates the observed `cntfrq_el0_primary_hz` because the kernel's
# TIMER_FREQUENCY must be pinned at build time even though the root reads the
# register. `max_irq` is the observed `gic_irqs`. UART0 is the kernel's debug
# console and the root's only output path.
platform = "ns02201-h1v1"
sel4_arch = "aarch64"
hypervisor = true
mcs = false
nodes = 1
verification_build = false
debug_build = true
printing = true
export_pcnt_user = true
export_ptmr_user = true
timer_irq = 30
timer_frequency_hz = 12000000
max_irq = 352
# The kernel's memory window: the platform overlay's single `memory` node, and
# on aarch64 therefore the kernel's physical base. Above every firmware
# reservation, below U-Boot's device-tree relocation zone, inside the 1 GiB
# the vendor tree declares.
sel4_memory_base = "0x10000000"
sel4_memory_size = "0x30000000"
# The SoC reset the root drives after a scored run: the clock-gate and
# watchdog blocks TF-A's own nova_system_reset programs (`nvt_ns02201/pm.c`,
# `novatek_def.h`). `reset_write_width` is what the P6.B reset probe observed
# from the non-secure world; absent until it has run.
reset_cg_base = "0x2f0020000"
reset_wdt_base = "0x2f0060000"
boot_files = ["slime-nt98690-probe.bin", "slime-sel4-sample-ns02201-h1v1.bin"]

[observed_prefix_ns02201_h1v1]
# Recorded from the exact fork commits, toolchain, and NS02201 config above,
# on the first build of the platform (2026-09-02). The device tree is in-tree,
# so `dtb_sha256` binds the board description itself, not an emulator's dump.
kernel_sha256 = "481fe1b1bd2f1f8939098802d985a214f98660e6a2c0d2a4d08399891cdfa1b9"
kernel_config_sha256 = "b64c92a963f5b96bc995b05040de454b1714e4fdaba7328631346f69b59a1dc6"
libsel4_config_sha256 = "ccd1c7f73790485f92fadaf954e71f3d68b80a664a96b402e33da5bb57a06825"
dtb_sha256 = "cfc8088b03392223808848a0a49f9f7064819adad881bcc0e7bc1e65bb6af85e"
platform_info_sha256 = "64e8a68e789b407d3260b8c022966fda78805dc2de812a247d3b8a8e8f84cbcf"

[observed_prefix_cv1800b_duo]
# Recorded from the exact fork commits, toolchain, and CV1800B config above.
kernel_sha256 = "bf743ec2f8f51bd260d9c3b700ddc01b199039e5af2075de9501967c65c2e4f2"
kernel_config_sha256 = "54505da3732f8b07251bd6fbbdb96d211cbce17cad0d9ddb91a5924be5067f69"
libsel4_config_sha256 = "ccd1c7f73790485f92fadaf954e71f3d68b80a664a96b402e33da5bb57a06825"
dtb_sha256 = "a9e15726b591cf86777a4a2db9a6a7c1155eda62a6067a70a28fa2435d675bae"
platform_info_sha256 = "992415a47d0ccd67a180b01bb35a49e5a5545165458e6e3027e68f531bc90a0d"


# Hashes of the installed seL4 prefix, observed from `just sel4_qemu_image_check`.
# The build pins the QEMU device-tree dump (`dtb-randomness=off`), maps the
# source and build roots to fixed logical prefixes, drops the ambient dev
# shell's compiler flags in favour of a fixed `-frandom-seed`, states its own
# frame-pointer policy, and takes the cross toolchain by absolute store path.
# So these depend on neither the shell that ran the build nor the platform it
# ran on: adding a package to `flake.nix` changes that shell's derivation hash
# and leaves these unchanged (B19), and `aarch64-darwin`, `aarch64-linux`, and
# `x86_64-linux` produce a byte-identical `kernel.elf` (B20, B21).
#
# What they do still bind, beyond the pinned seL4 source and config: the
# compiler *version*, and the build tooling this file does not pin — `cmake`,
# `ninja`, and the host Python generators (`bitfield_gen.py`,
# `invocation_header_gen.py`, `hardware_gen.py`, …) whose output is compiled into
# `kernel.elf`. A `cmake` or `jinja2` bump in `flake.nix` can therefore move
# `kernel_sha256` even though the compiler did not change, and the failure
# message will still say "toolchain drift". Narrowing that is a separate change
# to what this file pins.
#
# Observed on `aarch64-darwin`, `aarch64-linux`, and `x86_64-linux`, all with
# GCC 15.2.0 from `pkgsCross.aarch64-multiplatform`. That attribute is a *cross*
# `gcc-wrapper` on Darwin and `x86_64-linux` and a *native* one on
# `aarch64-linux`; all three ship the same `nix-support/cc-cflags-before`, and
# B20's claim that the native one "forces neither" frame-pointer flag was
# wrong. What actually differed was binary selection: the native wrapper
# exports no `aarch64-unknown-linux-gnu-`-prefixed `gcc`, so a bare prefix fell
# through to the *unwrapped* compiler and a different `as`. `flake.nix` now
# exports an absolute `CROSS_COMPILER_PREFIX`, so every host runs the same
# driver and assembler (B21) — which is what makes this a toolchain gate rather
# than a host gate.
# P3's RV64 QEMU reference prefix. The input DTB is normalized by deleting
# QEMU's runtime-only `/chosen/rng-seed`; all remaining hashes bind the pinned
# seL4 source, including P3.E's globally declared but QEMU-disabled
# `RISCV_EXPORT_TIME_USER` option, QEMU machine facts, config, and GNU RISC-V
# toolchain.
[observed_prefix_qemu_riscv_virt]
kernel_sha256 = "ef24f1fbc8084cb307d12e73a72d41d0944e67ffc3e872079fc44eda56a40d9f"
kernel_config_sha256 = "8d0ef4446b1332312dd9f2ab0557c8027fb2df6f391bb04f08a0c74b73b83ca6"
libsel4_config_sha256 = "ccd1c7f73790485f92fadaf954e71f3d68b80a664a96b402e33da5bb57a06825"
dtb_sha256 = "7e60b8954a02e149a36e3e58eb70af2f4853ae347e9d8df0194c3fcb5f1e9c87"
platform_info_sha256 = "1433a46cdc40b51d91b3f6c2dc7a7d5d1692fe2aae3c401c02d12622d5fb85e2"

[observed_prefix]
kernel_sha256 = "97dcb029127bcc0fac1fd6cc83950ba878040a773a380e2d000b0ebc20d875ce"
kernel_config_sha256 = "3a76491c41dc53e6c5c754cd839d350a67298e9d19fc47c9cc9544db91497e2f"
libsel4_config_sha256 = "ccd1c7f73790485f92fadaf954e71f3d68b80a664a96b402e33da5bb57a06825"
dtb_sha256 = "2c9a92343b95448b8c63785adf728aa94eca4a70f9ff35b36b5a062800c040a8"
platform_info_sha256 = "9a8eca4b07ddf06130d713ce4e4a7d52944955fc29fa826b5e28c9a318d65f6c"

# The same contract for P4's board kernel, observed from
# `just sel4_rpi5_image_check`. A separate table because this is a different
# kernel from the one above — different platform, CPU, device tree, and
# interrupt controller — so a single set of hashes could not describe both.
#
# `dtb_sha256` is a stronger pin here than for qemu-arm-virt: the Pi 5's device
# tree is compiled from `deps/sel4/tools/dts/rpi5b.dts` plus the two overlays
# rather than dumped from an emulator, so this hash changes if and only if the
# pinned kernel's own board description changes. Widening the memory overlay
# moves it, which is the intended alarm.
[observed_prefix_bcm2712_rpi5]
kernel_sha256 = "4c29234e4d811baa21af74783377d3fdd80161bfe26582eff96f3fa4d1520a4c"
kernel_config_sha256 = "f421bc279b09c90834401a7e2f0be5ec563bf90f1e088db0c2f0378ab073fa25"
libsel4_config_sha256 = "ccd1c7f73790485f92fadaf954e71f3d68b80a664a96b402e33da5bb57a06825"
dtb_sha256 = "5e38d5dad9b4e1b3e600330acb7750599c0a0d146c5c790ff8175b9d24e9db1b"
platform_info_sha256 = "1e386f61b9578985a7cdfff93e647cbfab0468ff88fbf339ff715619d7ce138a"

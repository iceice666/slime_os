# cargo-deny configuration — `just deny`.
#
# The stage0/kernel trust chain depends on ed25519-dalek / curve25519-dalek /
# sha2; a vulnerable or substituted crypto crate undermines verified boot, so
# advisories and source pinning are the sections that matter most here.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Workspace crates are publish = false and carry no license field.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# `deps/rust-sel4` is a source-pinned upstream workspace. Its public crates use
# internal path dependencies, so skip every root through which that vendored
# workspace enters the product graph; registry wildcard policy is inapplicable.
skip-tree = [
    { name = "sel4", depth = 20 },
    { name = "sel4-root-task", depth = 20 },
    { name = "sel4-runtime-common", depth = 20 },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/iceice666/zutai.git",
    "https://github.com/iceice666/dango.git",
]

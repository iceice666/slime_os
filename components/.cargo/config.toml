# `--remap-path-prefix` is deliberately absent here and supplied by
# `scripts/build/build-generation.py` instead, which computes the repository root
# at build time. A hardcoded literal named one developer's checkout: it was a
# no-op in any other, and worse when it happened to be a *prefix* of the real
# path, because it rewrote the leading portion and left the remainder — mangling
# recorded paths rather than normalizing them. See B12.

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=small",
    "-C", "link-arg=--build-id=none",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=4096",
]

[target.aarch64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=small",
    "-C", "link-arg=--build-id=none",
    "-C", "link-arg=-z",
    "-C", "link-arg=max-page-size=4096",
]

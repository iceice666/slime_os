[package]
name = "slime-component-fabric-service"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"
build = "build.rs"

[[bin]]
name = "fabric-service"
path = "src/main.rs"
test = false

[dependencies]
boot-contracts = { path = "../../../boot-contracts" }
slime-components = { path = "../../lib" }
slime-proto = { path = "../../proto" }
# C10.4: the stream plane's role and frame tables are sized from the graph this
# generation declared rather than from the contract's ceilings, so they are
# allocated from the task-private region. `private-heap` rather than `heap`
# because the tables live for the whole plane and a bump allocator that never
# reuses would make the declared quota a one-shot budget.
slime-rt = { path = "../../runtime", features = ["private-heap"] }

[build-dependencies]
slime-build-support = { path = "../../build-support" }

[lints]
workspace = true

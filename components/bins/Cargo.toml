[package]
name = "slime-components"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"
build = "build.rs"
autobins = false

[lib]
name = "slime_components"
path = "src/lib.rs"
doctest = false

[dependencies]
boot-contracts = { path = "../../boot-contracts" }
slime-rt = { path = "../runtime", optional = true }
slime-proto = { path = "../proto" }

[features]
default = ["component-runtime"]
component-runtime = ["dep:slime-rt"]
# GPT validation and the object store, which the seL4 store plane runs in
# userspace (P5.4.2c). Off by default and enabled only for the store-plane
# build: both need an allocator, and `extern crate alloc` in a dependency makes
# *every* binary in this crate require a `#[global_allocator]` — including the
# ones that never allocate. Only `sel4-store-probe` declares a heap.
store = ["boot-contracts/gpt", "slime-rt/heap"]
# Product components always use the native seL4 transport.
sel4 = ["component-runtime"]

[[bin]]
name = "console"
path = "src/bin/console.rs"
test = false


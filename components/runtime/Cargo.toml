[package]
name = "slime-rt"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"

[lib]
doctest = false

# Every component uses the native seL4 transport: operations become `seL4_Call`s
# on the root service endpoint and `entry!` performs real seL4 task startup.
#
# `heap` registers a bump `#[global_allocator]`. CP3 scoped it: the six
# store-plane components declare `slime-rt/heap` and `boot-contracts/gpt` in
# their own crates, and the builder compiles them in a separate invocation from
# every other component. That second part is load-bearing rather than tidy —
# Cargo unifies features across all packages in one invocation, so a plain
# component built alongside a store component links the allocator too.
# `just component_crate_split_check` pins both halves.
#
# `private-heap` (C10.3) registers a different one: a free list over the task's
# generation-declared private region. It is mutually exclusive with `heap` —
# `lib.rs` refuses both with a `compile_error!` — and gets its own build group
# for exactly the same feature-unification reason.
[features]
default = []
heap = []
private-heap = []

[dependencies]
sel4 = { path = "../../deps/rust-sel4/crates/sel4" }
sel4-panicking-env = { path = "../../deps/rust-sel4/crates/sel4-panicking/env" }
sel4-runtime-common = { path = "../../deps/rust-sel4/crates/sel4-runtime-common" }
# B59: the root-service operation labels, status codes, and spawn-grant record
# layout are generated from `contracts/syscall-abi/v1` into `slime-proto`, and
# `slime-root` consumes the same module. Before this the two crates each
# hand-authored the tables; `slime-root/src/console.rs` records a numbering
# disagreement between them that produced silently garbled keystrokes.
slime-proto = { path = "../proto" }
# C9.2: the wait-set source records the root serves are decoded with
# `boot_contracts::wait_set`, so the badge/kind/slot layout has one reader
# rather than a second copy here. Acyclic: `boot-contracts` depends on no
# workspace crate, and components already link it (`clock-authority-probe`
# reads the rights vocabulary from it).
boot-contracts = { path = "../../boot-contracts" }

[lints]
workspace = true

[package]
name = "slime-rt"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"

[lib]
doctest = false

# Every component uses the native seL4 transport: operations become `seL4_Call`s
# on the root service endpoint and `entry!` performs real seL4 task startup.
#
# `heap` registers a bump `#[global_allocator]`. It is enabled only for the
# store-plane build, where `boot-contracts/gpt` brings `extern crate alloc` into
# the dependency graph and every binary then needs the symbol.
[features]
default = []
heap = []

[dependencies]
sel4 = { path = "../../deps/rust-sel4/crates/sel4" }
sel4-panicking-env = { path = "../../deps/rust-sel4/crates/sel4-panicking/env" }
sel4-runtime-common = { path = "../../deps/rust-sel4/crates/sel4-runtime-common" }

[lints]
workspace = true

name: Save the Zutai evaluation store
description: >
  Save the Zutai evaluation store under the key `slime-env` exported, pruned to
  the entries this job read or wrote when every check ran to completion. Run
  after the job's checks with `if: always()`: only zero-exit evaluations are
  ever stored, so a store from a failed or cancelled job is as sound as one
  from a passing job.

inputs:
  checks-completed:
    description: >-
      'true' only when every check in the job succeeded. A failed or cancelled
      job never read the entries its unrun checks need, so its store is saved
      unpruned rather than shrunk to what it reached.
    required: true

runs:
  using: composite
  steps:
    - name: Prune unread evaluations
      shell: bash
      env:
        CHECKS_COMPLETED: ${{ inputs.checks-completed }}
      run: |
        set -euo pipefail
        store=build/zutai-cache
        if [ -z "${SLIME_ZUTAI_STORE_KEY:-}" ]; then
          echo "slime-env exported no store key; nothing to save"
          exit 0
        fi
        [ -d "$store" ] || exit 0
        before="$(find "$store" -type f | wc -l)"
        if [ "${SLIME_ZUTAI_STORE_PRUNE:-}" = 1 ] && [ "$CHECKS_COMPLETED" = true ]; then
          # Still at atime 0: restored, never read.
          find "$store" -type f ! -newerat @1 -delete
        else
          echo "saving unpruned (prune=${SLIME_ZUTAI_STORE_PRUNE:-0}, checks completed=$CHECKS_COMPLETED)"
        fi
        echo "Zutai store: $before entries, $(find "$store" -type f | wc -l) kept, $(du -sh "$store" | cut -f1)"

    - name: Save Zutai evaluation store
      if: env.SLIME_ZUTAI_STORE_KEY != ''
      uses: actions/cache/save@v4
      with:
        path: build/zutai-cache
        key: ${{ env.SLIME_ZUTAI_STORE_KEY }}

name: Save the Zutai evaluation store
description: >
  Prune the Zutai evaluation store to the entries this job read or wrote, then
  save it under the key `slime-env` exported. Run after the job's checks, with
  `if: "!cancelled()"`: only zero-exit evaluations are ever stored, so a store
  from a failed check is as sound as one from a passing check.

runs:
  using: composite
  steps:
    - name: Prune unread evaluations
      shell: bash
      run: |
        set -euo pipefail
        store=build/zutai-cache
        test -n "${SLIME_ZUTAI_STORE_KEY:-}" || { echo "slime-env did not run" >&2; exit 1; }
        [ -d "$store" ] || exit 0
        before="$(find "$store" -type f | wc -l)"
        if [ "${SLIME_ZUTAI_STORE_PRUNE:-}" = 1 ]; then
          # Still at atime 0: restored, never read.
          find "$store" -type f ! -newerat @1 -delete
        fi
        echo "Zutai store: $before entries, $(find "$store" -type f | wc -l) kept, $(du -sh "$store" | cut -f1)"

    - name: Save Zutai evaluation store
      uses: actions/cache/save@v4
      with:
        path: build/zutai-cache
        key: ${{ env.SLIME_ZUTAI_STORE_KEY }}

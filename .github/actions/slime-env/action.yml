name: Slime environment
description: >
  Make this repository's Nix dev shell available, so a workflow step runs the
  same `just` target against the same tool versions a developer does.

  The caller must run `actions/checkout` first: a local action is resolved from
  the checked-out tree, so this action cannot check out the tree it lives in.
inputs:
  build-cache-key:
    description: >-
      Partition for the Zutai evaluation store, and for build outputs unless
      build-partition is set; empty uses the caller job.
    required: false
    default: ''
  build-partition:
    description: >-
      Build-output partition shared with other jobs that run the same build;
      empty uses build-cache-key.
    required: false
    default: ''
  build-save:
    description: >-
      Whether this job saves its build-output partition. Exactly one job per
      shared partition saves it, so jobs never race to save one key.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Single-user install, no daemon. The store is restored below rather than
    # rebuilt, so the dev shell's closure is fetched once per lockfile.
    - uses: nixbuild/nix-quick-install-action@v35
      with:
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    # `~/.rustup` and `~/.cargo` ride along with the store. The dev shell's
    # hook installs both pinned toolchains on first entry, and the seL4 build
    # is deliberately `--offline`, so without these every job re-downloads two
    # nightlies and then fails to resolve a dependency.
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: >-
          slime-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('flake.lock', 'flake.nix', 'sel4/pins.toml',
                      'rust-toolchain.toml', '**/Cargo.lock')
          }}
        restore-prefixes-first-match: slime-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size-linux: 5G
        paths: |
          ~/.rustup
          ~/.cargo/registry
          ~/.cargo/git
    # Cargo owns invalidation for Rust sources and declared build-script inputs.
    # Keep the restore boundary stricter for inputs outside Cargo's fingerprints:
    # the exact submodule gitlinks, seL4 configuration/pins, target definitions,
    # linker scripts, lockfiles, and both pinned Rust toolchains. The final
    # component is the UTC date, not the commit: a partition is written at most
    # once a day, which keeps the saved set inside the repository's cache
    # budget, and restored outputs are at most a day behind. The matching
    # prefix restores the newest earlier entry, and Cargo rebuilds what changed.
    - name: Identify build-cache submodules
      id: build-cache-submodules
      shell: bash
      run: |
        set -euo pipefail
        gitlinks="$({
          git rev-parse HEAD:deps/zutai
          git rev-parse HEAD:deps/sel4
          git rev-parse HEAD:deps/rust-sel4
          git rev-parse HEAD:deps/rust-sel4-bcm2712-rpi5
          git rev-parse HEAD:deps/rust-sel4-cv1800b-duo
        } | git hash-object --stdin)"
        echo "gitlinks=$gitlinks" >> "$GITHUB_OUTPUT"

    - name: Build-cache key
      id: build-cache-key
      shell: bash
      env:
        PREFIX: >-
          slime-build-v2-${{ runner.os }}-${{ runner.arch }}-${{
            inputs.build-partition || inputs.build-cache-key || github.job
          }}-${{
            hashFiles('flake.lock', 'flake.nix', 'rust-toolchain.toml',
                      'deps/zutai/.cargo/config.toml',
                      'deps/rust-sel4/rust-toolchain.toml',
                      'deps/rust-sel4/.cargo/config.toml',
                      'sel4/pins.toml', 'sel4/config/*.cmake',
                      'components/**/*.ld', '**/Cargo.lock')
          }}-${{ steps.build-cache-submodules.outputs.gitlinks }}-
      run: |
        echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
        echo "key=${PREFIX}$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    # A partition is 0.5 to 1.5 GB against a 10 GB repository budget, and
    # least-recently-used eviction removes whatever the budget cannot hold, the
    # Zutai evaluation store among them. Only the base branch saves, and only
    # the partition's designated job; a pull request or a sharing job restores
    # the saved outputs and lets Cargo rebuild the rest. An exact key hit saves
    # nothing.
    - name: Restore and save persistent Cargo build outputs
      if: github.event_name != 'pull_request' && inputs.build-save == 'true'
      uses: actions/cache@v4
      with:
        path: |
          deps/zutai/target
          target/components
          build/sel4-cargo
        key: ${{ steps.build-cache-key.outputs.key }}
        restore-keys: ${{ steps.build-cache-key.outputs.prefix }}

    - name: Restore persistent Cargo build outputs
      if: github.event_name == 'pull_request' || inputs.build-save != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          deps/zutai/target
          target/components
          build/sel4-cargo
        key: ${{ steps.build-cache-key.outputs.key }}
        restore-keys: ${{ steps.build-cache-key.outputs.prefix }}

    # The Zutai evaluation store is content-addressed (`scripts/lib/zutai_cli.py`):
    # an entry whose inputs changed is never looked up, so a stale restore costs
    # misses, not results. GitHub scopes caches saved on a pull-request ref to
    # that pull request, so `main` never restores one. Saved by
    # `.github/actions/slime-zutai-store-save` once the job's checks finish.
    - name: Restore Zutai evaluation store
      id: zutai-store
      uses: actions/cache/restore@v4
      with:
        path: build/zutai-cache
        key: >-
          slime-zutai-v1-${{ runner.os }}-${{ runner.arch }}-${{
            inputs.build-cache-key || github.job
          }}-${{ github.sha }}
        restore-keys: >-
          slime-zutai-v1-${{ runner.os }}-${{ runner.arch }}-${{
            inputs.build-cache-key || github.job
          }}-

    # Every restored entry gets atime 0. Under `relatime` the first read moves
    # it past its mtime, so the save step keeps exactly the entries this run
    # read or wrote. Where reads do not update atime, pruning is disabled
    # rather than discarding entries that were in fact used.
    - name: Mark restored evaluations unread
      shell: bash
      env:
        ZUTAI_STORE_KEY: >-
          slime-zutai-v1-${{ runner.os }}-${{ runner.arch }}-${{
            inputs.build-cache-key || github.job
          }}-${{ github.sha }}
      run: |
        set -euo pipefail
        echo "SLIME_ZUTAI_STORE_KEY=$ZUTAI_STORE_KEY" >> "$GITHUB_ENV"
        store=build/zutai-cache
        mkdir -p "$store"
        probe="$(mktemp -p build)"
        echo probe > "$probe"
        touch -a -d @0 "$probe"
        cat "$probe" > /dev/null
        if [ "$(stat -c %X "$probe")" -gt 0 ]; then
          find "$store" -type f -exec touch -a -d @0 {} +
          echo "SLIME_ZUTAI_STORE_PRUNE=1" >> "$GITHUB_ENV"
        else
          echo "::warning::reads do not update atime here; the Zutai store is saved unpruned"
        fi
        rm -f "$probe"
        echo "restored $(find "$store" -type f | wc -l) evaluations (matched: ${{ steps.zutai-store.outputs.cache-matched-key || 'none' }})"

    # Realize the shell and run its toolchain hook once, so a later step's
    # failure is the gate's failure rather than an environment download.
    - name: Enter the dev shell
      shell: bash
      run: nix develop --command just --version

    # `build-sel4.py` builds every crate `--locked --offline`, deliberately: a
    # build that may reach the network is not the pinned build the observed
    # prefix hashes describe. Populating the cargo cache is therefore the
    # environment's job.
    - name: Fetch pinned crates
      shell: bash
      run: |
        set -euo pipefail
        toolchain="$(nix develop --command python3 -c \
          "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('sel4/pins.toml').read_text())['rust_sel4']['toolchain'])")"
        # Our own workspaces, each with its own lockfile, because `cargo
        # fetch` resolves one manifest at a time: the two top-level
        # workspaces, the shared base rust-sel4 checkout, and one per patched
        # physical platform's independent loader submodule
        # (`sel4/pins.toml`'s `[rust_sel4_<platform>]` tables).
        for manifest in \
          Cargo.toml \
          slime-root/child/Cargo.toml \
          deps/rust-sel4/Cargo.toml \
          deps/rust-sel4-bcm2712-rpi5/Cargo.toml \
          deps/rust-sel4-cv1800b-duo/Cargo.toml \
        ; do
          echo "::group::cargo fetch $manifest"
          nix develop --command cargo fetch --locked --manifest-path "$manifest"
          RUSTUP_TOOLCHAIN="$toolchain" \
            nix develop --command cargo fetch --locked --manifest-path "$manifest"
          echo "::endgroup::"
        done
        # And the standard library's own workspace, which is the one that
        # actually broke: `-Z build-std` compiles `sysroot` from `rust-src`,
        # and that workspace pulls crates.io dependencies of its own
        # (`unwinding`, `compiler_builtins`, ...) which no manifest above
        # names. Fetching only our lockfiles left the child build resolving
        # `unwinding` offline against an empty cache.
        for tc in "$toolchain" ""; do
          sysroot="$(RUSTUP_TOOLCHAIN="$tc" nix develop --command rustc --print sysroot | tail -1)"
          library="$sysroot/lib/rustlib/src/rust/library"
          # Absent unless `rust-src` is installed for that toolchain; the dev
          # shell's hook installs it for both, so a miss is worth reporting
          # rather than skipping silently.
          if [ ! -f "$library/Cargo.toml" ]; then
            echo "no rust-src library workspace at $library" >&2
            exit 1
          fi
          echo "::group::cargo fetch rust-src (${tc:-default})"
          RUSTUP_TOOLCHAIN="$tc" \
            nix develop --command cargo fetch --locked --manifest-path "$library/Cargo.toml"
          echo "::endgroup::"
        done

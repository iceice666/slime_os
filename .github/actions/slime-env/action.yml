name: Slime environment
description: >
  Check out the pinned tree and make this repository's Nix dev shell available,
  so a workflow step runs the same `just` target against the same tool versions
  a developer does.

inputs:
  free-disk:
    description: >
      Remove the runner image's preinstalled SDKs before building. The seL4
      gates write a per-manifest cargo directory per generation, which is tens
      of gigabytes; the hosted image ships ~10 GB of Android/.NET/GHC tooling
      no Slime gate uses.
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Reclaim runner disk
      if: inputs.free-disk == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Best-effort: the hosted image's contents change, and a missing
        # directory is not a reason to fail a build gate.
        sudo rm -rf \
          /usr/local/lib/android \
          /usr/share/dotnet \
          /usr/share/swift \
          /opt/ghc \
          /usr/local/share/powershell \
          /usr/local/share/chromium \
          /usr/local/share/boost || true
        df -h /

    # Single-user install, no daemon. The store is restored below rather than
    # rebuilt, so the dev shell's closure is fetched once per lockfile.
    - uses: nixbuild/nix-quick-install-action@v35
      with:
        nix_conf: |
          keep-env-derivations = true
          keep-outputs = true

    # `~/.rustup` rides along with the store because the dev shell's hook
    # installs both pinned toolchains on first entry; without it every job
    # re-downloads two nightlies before running a single check.
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: >-
          slime-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('flake.lock', 'flake.nix', 'sel4/pins.toml', 'rust-toolchain.toml')
          }}
        restore-prefixes-first-match: slime-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size-linux: 5G
        paths: |
          ~/.rustup

    # Realize the shell and run its toolchain hook once, so a later step's
    # failure is the gate's failure rather than an environment download.
    - name: Enter the dev shell
      shell: bash
      run: nix develop --command just --version

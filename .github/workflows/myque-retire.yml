name: Retire completed MyQue items

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a retirement PR after verifying repository safeguards
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: myque-retire-${{ github.repository }}
  cancel-in-progress: false

jobs:
  retire:
    if: >-
      github.repository == 'iceice666/slime_os' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.MYQUE_RETIRE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Only trusted canonical code runs with publication credentials.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: >-
            projection-${{ runner.os }}-${{ runner.arch }}-${{
              hashFiles('flake.lock', 'flake.nix', 'nix/devloop.nix', 'nix/zutai.nix')
            }}
          restore-prefixes-first-match: projection-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 5G

      - name: Preview or publish retirement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          MYQUE_RETIRE_RULES_APPROVAL: ${{ vars.MYQUE_RETIRE_RULES_APPROVAL }}
        shell: bash
        run: |
          gh auth setup-git
          args=()
          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--apply)
          fi
          nix develop .#projection --command \
            python3 scripts/lib/work_item_retirement_publish.py "${args[@]}"

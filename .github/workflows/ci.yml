name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-26
          targets: aarch64-unknown-uefi,x86_64-unknown-uefi
          components: clippy,rustfmt,rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just fmt_check_all
      # Host-buildable crates only. Product component/runtime lint runs on the
      # seL4 image builder through `just lint_sel4_root`.
      - run: just lint_stage0 lint_boot_contracts

  sel4_pins:
    name: seL4 pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: extractions/setup-just@v2
      # Static pin validation only: submodule commits and origins, the seL4
      # release, both Rust toolchain pins, the root target spec bytes, and the
      # qemu-arm-virt kernel configuration. `--skip-host-tools` drops the
      # installed-rustup and QEMU-version assertions, which belong to the
      # machine that actually builds and boots the image.
      - run: python3 scripts/check/check-sel4-pins.py --skip-host-tools

  test_host:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-26
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just test_host
      # `just test_sel4_root` is deliberately absent, for `lint_sel4_root`'s
      # reason: `slime-root`'s tests compile against the installed seL4 prefix,
      # which this runner does not build. They run in the pinned `nix develop`
      # shell alongside the image and the seL4 gates. Listed here so the
      # omission reads as a decision rather than an oversight.

  miri:
    name: Miri (boot-contracts, slime-proto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-26
          components: miri,rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just miri

  contracts:
    name: Contracts and devlog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-26
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just contracts_check
      - run: just devlog_check
      # No build and no QEMU: it drives each seL4 gate's own marker table with
      # transcripts that are wrong in one specific way, so it runs anywhere the
      # checkers import.
      - run: just sel4_gate_control_check

  deps:
    name: cargo-deny and machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo-machete boot-contracts components slime-root stage0

  scripts:
    name: ruff and typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check scripts/
      - uses: crate-ci/typos@v1

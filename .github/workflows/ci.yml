name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-26
          targets: x86_64-unknown-none,x86_64-unknown-uefi
          components: clippy,rustfmt,rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just fmt_check_all
      - run: just lint_all

  test_host:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-26
          targets: x86_64-unknown-none
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just test_host

  miri:
    name: Miri (boot-contracts, slime-proto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-26
          targets: x86_64-unknown-none
          components: miri,rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just miri

  contracts:
    name: Contracts and devlog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-05-26
          targets: x86_64-unknown-none
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just contracts_check
      - run: just devlog_check

  deps:
    name: cargo-deny and machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo-machete boot-contracts components kernel stage0

  scripts:
    name: ruff and typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check scripts/
      - uses: crate-ci/typos@v1

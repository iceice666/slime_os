# After every push to main: regenerate the derived closure sources and commit
# them to main when they changed (docs/decisions/work-item-devloop.md, D1),
# then run each bound target that has no record at its current closure
# digest, write the records, and commit them to the `evidence` branch
# (proposal/devloop-redesign/, decision E4). The derive job is the only one
# that writes main, and it writes only `lib.DERIVED` paths.
#
# `plan` resolves every bound target's closure and balances the claimed ones
# over at most 8 shards by observed wall time (specs/wall-time.toml). Each
# shard records its targets and uploads the records; `publish` gathers them
# and pushes once, serialised by the concurrency group, retrying once after
# a non-fast-forward.
name: Evidence

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include-failing:
        description: Also re-run targets whose record at the current digest failed
        type: boolean
        default: false

concurrency:
  group: evidence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # A push made with GITHUB_TOKEN starts no workflow, so this run records the
  # derived commit itself: every later job checks out `needs.derive.outputs.sha`.
  # If regeneration fails or main moved on, the jobs record the pushed commit
  # as it is (decision Q6): a stale closure fails its gates, and the next pull
  # request that touches their owns must fix it.
  derive:
    name: Regenerate derived closure sources
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/slime-env
        with:
          build-save: 'false'
      - id: regenerate
        continue-on-error: true
        shell: bash
        run: nix develop --command python3 scripts/spec/derived --regenerate
      - id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          git add -A -- contracts/system-image-closure/v3/closures contracts/system-image-closure/v2/negative
          git fetch -q origin main
          if [ "${{ steps.regenerate.outcome }}" != success ]; then
            echo "regeneration failed; recording ${sha:0:12} as pushed"
          elif git diff --cached --quiet; then
            echo "closure sources are current"
          elif [ "$sha" != "$(git rev-parse origin/main)" ]; then
            echo "main moved on; recording ${sha:0:12} as pushed"
          else
            git -c user.name="slime-evidence" -c user.email="evidence@users.noreply.github.com" \
              commit -q -m "chore(derived): regenerate system-image closure sources for ${sha:0:12}"
            if git push origin HEAD:refs/heads/main; then sha="$(git rev-parse HEAD)"; else echo "push refused; recording ${sha:0:12} as pushed"; fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  plan:
    name: Claimed targets
    needs: [derive]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.derive.outputs.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/slime-env
        with:
          build-save: 'false'
      - run: git fetch origin +refs/heads/evidence:refs/remotes/origin/evidence || true
      - id: plan
        run: |
          nix develop --command python3 scripts/spec/ci --plan 8 --out "$RUNNER_TEMP/shards.json" \
            ${{ inputs.include-failing && '--include-failing' || '' }}
          cat "$RUNNER_TEMP/shards.json"
          echo "shards=$(cat "$RUNNER_TEMP/shards.json")" >> "$GITHUB_OUTPUT"

  record:
    name: Record shard ${{ matrix.shard }}
    needs: [derive, plan]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-24.04-arm
    # The signing key lives in this environment, whose deployment branch
    # policy admits main only (decision E4): a workflow edited on a branch
    # cannot reach it.
    environment: evidence
    # sel4_large_image_check alone takes 131 minutes after a 10-minute setup.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # Full history: image_attestation_check attaches notes to HEAD's ancestors.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.derive.outputs.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/slime-env
        with:
          build-save: 'false'
      - name: Signing key
        env:
          EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
        run: |
          if [ -z "$EVIDENCE_SIGNING_KEY" ]; then echo "no signing key in this environment; records stay unsigned"; exit 0; fi
          install -m 600 /dev/null "$RUNNER_TEMP/evidence-key"
          printf '%s\n' "$EVIDENCE_SIGNING_KEY" > "$RUNNER_TEMP/evidence-key"
          echo "SPEC_SIGN=--signer ci --key $RUNNER_TEMP/evidence-key" >> "$GITHUB_ENV"
      # Produces build/sel4-prefix, which test_sel4_root and every plane expect.
      - run: nix develop --command just sel4_qemu_image_check
      - run: nix develop --command python3 scripts/spec/ci --runner ci $SPEC_SIGN --targets ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observations-${{ matrix.shard }}
          path: build/observations/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish records
    needs: [derive, plan, record]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.derive.outputs.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/slime-env
        with:
          build-save: 'false'
      - run: git fetch origin +refs/heads/evidence:refs/remotes/origin/evidence || true
      - uses: actions/download-artifact@v4
        with:
          pattern: observations-*
          path: build/observations/
          merge-multiple: true
      - run: nix develop --command python3 scripts/spec/ci --publish
      - name: Push the evidence branch
        run: |
          git rev-parse -q --verify refs/heads/evidence >/dev/null || { echo "nothing to push"; exit 0; }
          for attempt in 1 2; do
            git push origin refs/heads/evidence:refs/heads/evidence && exit 0
            git fetch origin +refs/heads/evidence:refs/remotes/origin/evidence
            git update-ref -d refs/heads/evidence
            nix develop --command python3 scripts/spec/ci --publish
          done
          exit 1
      - run: nix develop --command python3 scripts/spec/status --unenforced

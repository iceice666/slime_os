# Per-target facts scripts/spec/ci reads. Not part of any digest.
#
# `operator`: targets CI cannot run (a board, a physical machine). Their
# records come from `scripts/spec/record <target> --signer <principal>`
# (decision D9); `ci --plan` never schedules them.
operator = [
  "rpi5_ros2_zenoh_check",
  "framework_cpu_boot_check",
]

# Observed wall time in seconds on the ubuntu-24.04-arm runner, as
# `scripts/spec/record` printed it; balances evidence shards. A missing
# target counts as 600.
[wall_time]
clock_direct_read_check = 913
robot_withdrawn_check = 23
sel4_lifetime_check = 740

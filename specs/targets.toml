# Per-target facts scripts/spec/ci reads. Not part of any digest.
#
# `operator`: targets CI cannot run. Their records come from
# `scripts/spec/record <target> --signer <principal>` (decision D9);
# `ci --plan` never schedules them. Besides the boards and the physical
# machine: the LiDAR exams need the operator's `SLIME_LIDAR_BAG` capture,
# and link_wake_check reaches zenoh_external_check, which has no
# eclipse-zenoh wheel pinned for linux aarch64. rpi5_boot_check needs the
# board on the operator's USB-C cable and its Debug Probe.
operator = [
  "rpi5_ros2_zenoh_check",
  "rpi5_boot_check",
  "framework_cpu_boot_check",
  "frame_store_check",
  "lidar_publish_check",
  "lidar_foxglove_bridge_check",
  "lidar_foxglove_demo_check",
  "link_wake_check",
]

# Ratchet R3 (`scripts/spec/ratchet`): package name -> crate directory. Only
# these crates have host tests `cargo mutants` can run; R3 measures the files
# an item owns inside them.
[mutants]
"slime-proto" = "components/proto"


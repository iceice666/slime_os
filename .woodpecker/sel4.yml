when:
  - event: push
    branch: [main, develop]
  - event: pull_request

labels:
  platform: linux/arm64
  backend: docker

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.6.3
    settings:
      recursive: true

matrix:
  include:
    - JOB: sel4_product
      TIMEOUT: 30m
      GATES: lint_sel4_root test_sel4_root
    - JOB: sel4_rollback_runtime
      TIMEOUT: 60m
      GATES: bootstate_trace_check release_trust_runtime_check
    - JOB: sel4_contract_sources
      TIMEOUT: 60m
      GATES: contracts_source_check component_spec_validation_check

steps:
  - name: ${JOB}
    image: nixos/nix:2.35.2
    environment:
      CARGO_TERM_COLOR: always
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
    commands:
      - |
        timeout ${TIMEOUT} nix develop --command bash -ec '
          bash scripts/ci/prepare-sel4.sh
          just sel4_qemu_image_check
          just ${GATES}
        '

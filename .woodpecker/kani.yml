when:
  - event: push
    branch: [main, develop]
  - event: pull_request

labels:
  platform: linux/amd64
  backend: docker

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.6.3
    settings:
      recursive: true

steps:
  - name: kani_proofs
    image: nixos/nix:2.35.2
    environment:
      CARGO_TERM_COLOR: always
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
    commands:
      - >-
        timeout 30m bash -ec
        'nix build .#kani;
        nix develop .#kani --command just kani_io_proofs kani_virtio_proofs'

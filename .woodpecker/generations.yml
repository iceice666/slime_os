when:
  - event: push
    branch: [main, develop]
  - event: pull_request

labels:
  platform: linux/arm64
  backend: docker

clone:
  - name: git
    image: woodpeckerci/plugin-git:2.6.3
    settings:
      recursive: true

matrix:
  SHARD: ['0', '1', '2', '3']

steps:
  - name: generation_v5_shard_${SHARD}
    image: nixos/nix:2.35.2
    environment:
      CARGO_TERM_COLOR: always
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
    commands:
      - |
        timeout 60m nix develop --command bash -ec '
          bash scripts/ci/prepare-sel4.sh
          just sel4_qemu_image_check
          just generation_v5_check ${SHARD} 4
        '

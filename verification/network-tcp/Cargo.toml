# Host tests compile the production engine directly without the seL4 runtime.
[package]
name = "slime-network-tcp-tests"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"

# Dependencies are used by the production modules included through #[path].
[package.metadata.cargo-machete]
ignored = ["boot-contracts", "slime-proto", "smoltcp"]

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
boot-contracts = { path = "../../boot-contracts" }
slime-proto = { path = "../../components/proto" }
smoltcp = { version = "=0.13.0", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "auto-icmp-echo-reply",
    "iface-max-addr-count-1",
    "iface-max-route-count-1",
    "iface-neighbor-cache-count-4",
] }

[lints]
workspace = true

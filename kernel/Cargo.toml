[package]
name = "slime_os-kernel"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.96"

[dependencies]
limine = "0.6.5"
spin = "0.12.2"
noto-sans-mono-bitmap = { version = "0.3.2", features = ["unicode-specials", "size_32"] }
boot-contracts = { path = "../boot-contracts", features = ["release-crypto"] }
slime-proto = { path = "../components/proto" }
# Not imported directly: forces the force-soft feature onto the sha2 that
# ed25519-dalek pulls in transitively. Without it, sha2's SIMD path hits an
# LLVM "Do not know how to split the result of this operator" crash on
# x86_64-unknown-none dev builds.
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }

[package.metadata.cargo-machete]
ignored = ["sha2"]

[lib]
doctest = false


[[test]]
name = "should_panic"
harness = false

[lints]
workspace = true

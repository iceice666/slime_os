[workspace]
resolver = "3"
members = [
    "boot-contracts",
    "components/bins/*",
    "components/build-support",
    "components/lib",
    "components/proto",
    "components/runtime",
    "slime-root",
    "stage0",
]

# Inherited by every member via `[lints] workspace = true`. Only lints the
# tree already passes belong here — `just lint` denies all warnings, so any
# addition with existing hits breaks the lint gate. Advisory-only lints
# (undocumented unsafe, cast truncation) run through `just lint_pedantic`.
[workspace.lints.clippy]
mem_forget = "deny"
todo = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# Size-first codegen for every component image and the libraries linked into
# one. `codegen-units = 1` is load-bearing rather than cosmetic: `slime-root`
# maps a component image whole, so fewer, larger units keep it smaller.
#
# Named one package at a time because Cargo offers no alternative. A
# `[profile.release.package."*"]` wildcard is accepted but deliberately does
# *not* apply to workspace members (verified: members still compiled at
# `opt-level=3` under it), and a glob such as `"slime-component-*"` is rejected
# outright as an invalid package name. A new component crate must therefore add
# its stanza here, which `just component_crate_split_check` enforces rather than
# leaving to review.

[profile.release.package.slime-components]
opt-level = "s"
codegen-units = 1
debug = false

[profile.release.package.slime-proto]
opt-level = "s"
codegen-units = 1
debug = false

